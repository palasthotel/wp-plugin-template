name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    # The template itself is never released; harmless in a repository created from it.
    if: github.repository != 'palasthotel/wp-plugin-template'
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-release-please.yml@v1
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
    secrets: inherit
